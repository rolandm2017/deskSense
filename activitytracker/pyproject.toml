# pyproject.toml

[project]
name = "desksense"
version = "0.1.0"
description = "Activity tracker project"
dependencies = [
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.3",
    "psutil>=7.2.2",
    "psycopg2>=2.9.11",
    "pydantic>=2.12.5",
    "pyee>=13.0.1",
    "pynput>=1.8.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "pytz>=2026.1.post1",
    "pywin32>=311",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.49",
    "tzdata>=2026.1",
    "uvicorn>=0.44.0",
    "zmq>=0.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"
# Include the standard sections along with your custom ones
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "PARTY1",
    "PARTY2",
    "PARTY3",
    "PARTY4",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
known_party1 = ["pytest", "unittest"]
known_party2 = ["asyncio", "sqlalchemy"]
known_party3 = ["pytz", "datetime", "time"]
known_party4 = ["typing"]
known_third_party = ["sqlalchemy"] # Add this line

multi_line_output = 3

[tool.black]
line-length = 93


[tool.pytest.ini_options]
testpaths = ["tests"] # Look for tests here
